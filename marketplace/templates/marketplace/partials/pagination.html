{% load fa %}
{% if page_obj.paginator.num_pages > 1 %}
  <nav class="mt-6 flex items-center justify-center gap-3 text-sm" aria-label="صفحه‌بندی">
    {% if page_obj.has_previous %}
      <a class="rounded-xl border border-slate-200 bg-white px-4 py-2 hover:border-teal-500" href="{% querystring page=page_obj.previous_page_number %}">قبلی</a>
    {% endif %}
    <span class="text-slate-500">صفحه {{ page_obj.number|fa_digits }} از {{ page_obj.paginator.num_pages|fa_digits }}</span>
    {% if page_obj.has_next %}
      <a class="rounded-xl border border-slate-200 bg-white px-4 py-2 hover:border-teal-500" href="{% querystring page=page_obj.next_page_number %}">بعدی</a>
    {% endif %}
  </nav>
{% endif %}
